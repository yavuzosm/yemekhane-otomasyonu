# =====================================================================
# Yemekhane Otomasyonu Â· BaÅŸlangÄ±Ã§ paketi
# Ã‡alÄ±ÅŸtÄ±rma:   docker compose up -d
# Durum:        docker compose ps -a
# SÄ±fÄ±rlama:    docker compose down -v   (tÃ¼m veri silinir, yeniden Ã¼retilir)
# =====================================================================
name: yemekhane

# Ortak ayarlar (YAML anchor). Ders ortamÄ± iÃ§indir; ÅŸifreler bilerek aÃ§Ä±ktÄ±r.
x-mysql-ortak: &mysql-ortak
  image: mysql:8.4
  restart: unless-stopped
  healthcheck:
    # 127.0.0.1 bilerek kullanÄ±lÄ±r: ilk kurulum sÄ±rasÄ±nda sunucu yalnÄ±zca
    # soket Ã¼zerinden aÃ§Ä±ktÄ±r, TCP yanÄ±t vermeye baÅŸladÄ±ÄŸÄ±nda kurulum bitmiÅŸtir.
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 60s

# Uygulama servisinin alacaÄŸÄ± ortam deÄŸiÅŸkenleri.
# Container'lar birbirine servis adÄ±yla ve Ä°Ã‡ portla (3306, 6379) baÄŸlanÄ±r.
# 3307 / 3308 yalnÄ±zca kendi bilgisayarÄ±nÄ±zdan (DBeaver, Workbench) baÄŸlanmak iÃ§indir.
x-uygulama-ortam: &uygulama-ortam
  TZ: Europe/Istanbul
  DB_YAZMA_HOST: mysql-primary
  DB_OKUMA_HOST: mysql-replica
  DB_PORT: "3306"
  DB_ADI: yemekhane
  DB_KULLANICI: yemekhane_app
  DB_SIFRE: Uyg_2026
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:

  # ---------------------------------------------------------------
  # Kaynak (yazma) veritabanÄ± Â· ÅŸema ve Ã¶rnek veri ilk aÃ§Ä±lÄ±ÅŸta yÃ¼klenir
  # ---------------------------------------------------------------
  mysql-primary:
    <<: *mysql-ortak
    command: [--server-id=1, --gtid-mode=ON, --enforce-gtid-consistency=ON, --log-bin=mysql-bin,
              --character-set-server=utf8mb4, --collation-server=utf8mb4_tr_0900_ai_ci,
              --default-time-zone=+03:00]
    environment:
      TZ: Europe/Istanbul
      MYSQL_ROOT_PASSWORD: yemekhane_kok
      MYSQL_DATABASE: yemekhane
      MYSQL_USER: yemekhane_app
      MYSQL_PASSWORD: Uyg_2026
    ports:
      - "3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - mysql-primary-veri:/var/lib/mysql

  # ---------------------------------------------------------------
  # Replika (okuma) veritabanÄ± Â· veriyi replica-setup ile kaynaktan alÄ±r
  # ---------------------------------------------------------------
  mysql-replica:
    <<: *mysql-ortak
    command: [--server-id=2, --gtid-mode=ON, --enforce-gtid-consistency=ON, --log-bin=mysql-bin,
              --character-set-server=utf8mb4, --collation-server=utf8mb4_tr_0900_ai_ci,
              --default-time-zone=+03:00, --relay-log=relay-bin]
    environment:
      TZ: Europe/Istanbul
      MYSQL_ROOT_PASSWORD: yemekhane_kok
    ports:
      - "3308:3306"
    volumes:
      - mysql-replica-veri:/var/lib/mysql

  # ---------------------------------------------------------------
  # ReplikayÄ± bir kez kurar, salt okunur yapar ve Ã§Ä±kar (exit 0).
  # Replika zaten kuruluysa hiÃ§bir ÅŸey yapmadan Ã§Ä±kar.
  # ---------------------------------------------------------------
  replica-setup:
    image: mysql:8.4
    entrypoint: ["bash", "/replica-setup.sh"]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: yemekhane_kok
      MYSQL_DATABASE: yemekhane
      MYSQL_USER: yemekhane_app
      MYSQL_PASSWORD: Uyg_2026
      REPL_USER: repl
      REPL_PASSWORD: Repl_2026
    volumes:
      - ./db/replica-setup.sh:/replica-setup.sh:ro
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Redis Â· menÃ¼ Ã¶nbelleÄŸi ve oturum deposu (AOF aÃ§Ä±k, yeniden baÅŸlatmada veri kalÄ±r)
  # ---------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-veri:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------
  # Apache 2.4 Â· HTML/CSS'i sunar, uygulama isteklerini uygulama servisine iletir.
  # Mod seÃ§imi: aÅŸaÄŸÄ±daki "-D WEBAPI" deÄŸerini MVC yolunu seÃ§tiyseniz "-D MVC" yapÄ±n.
  # ---------------------------------------------------------------
  frontend:
    build: ./apache
    restart: unless-stopped
    command: ["httpd-foreground", "-D", "WEBAPI"]
    environment:
      # UygulamanÄ±zÄ±n container iÃ§inde dinlediÄŸi adres. Port farklÄ±ysa burayÄ± deÄŸiÅŸtirin.
      UYGULAMA_ADRES: http://uygulama:8000
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/local/apache2/htdocs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/saglik.txt"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------
  # UYGULAMA Â· BU SERVÄ°SÄ° SÄ°Z YAZACAKSINIZ (AÅŸama 2)
  # 1. ./uygulama klasÃ¶rÃ¼ne kodunuzu ve Dockerfile'Ä± koyun.
  # 2. Uygulama container iÃ§inde 8000 portunu dinlesin (ya da UYGULAMA_ADRES'i deÄŸiÅŸtirin).
  # 3. AÅŸaÄŸÄ±daki satÄ±rlarÄ±n baÅŸÄ±ndaki "# " iÅŸaretlerini kaldÄ±rÄ±n.
  # ---------------------------------------------------------------
  uygulama:
    build: ./uygulama
    restart: unless-stopped
    environment:
      <<: *uygulama-ortam
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      replica-setup:
        condition: service_completed_successfully

volumes:
  mysql-primary-veri:
  mysql-replica-veri:
  redis-veri:

